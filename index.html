  if(ds.nd!==undefined){var wd=+ds.nd,ix=newDays.indexOf(wd);if(ix>-1){if(newDays.length>1)newDays.splice(ix,1);else{toast('En az bir gün seçmelisin');return}}else newDays.push(wd);buzz();refreshForm();return}
  if(ds.preset){newDays=ds.preset==='wk'?[1,2,3,4,5]:ds.preset==='we'?[0,6]:[0,1,2,3,4,5,6];buzz();refreshForm();return}
  if(ds.hd){var hh=habitById(ds.hd);if(!hh)return;var cur=sched(hh)?hh.days.slice():[0,1,2,3,4,5,6],w2=+ds.wd,j2=cur.indexOf(w2);
    if(j2>-1){if(cur.length===1){toast('En az bir gün seçili kalmalı');return}cur.splice(j2,1)}else cur.push(w2);
    if(cur.length===7)delete hh.days;else hh.days=cur.sort();persist('habits');buzz();render('keep');toast(hh.name.slice(0,24)+': '+daysLabel(hh.days));return}
  if(ds.month){cy=yy;cm=+ds.month;view='month';render('in-r');return}
  if(ds.arch){S.habits.forEach(function(h){if(h.id===ds.arch)h.archived=!h.archived});persist('habits');render('keep');return}
  if(ds.up){var i=S.habits.findIndex(function(h){return h.id===ds.up});if(i>0){var x=S.habits[i];S.habits[i]=S.habits[i-1];S.habits[i-1]=x;persist('habits');render('keep')}return}
  if(ds.del){var dh=habitById(ds.del);if(!dh)return;dh.deleted=Date.now();persist('habits');buzz();render('keep');
    showUndo('“'+dh.name.slice(0,26)+'” çöp kutusuna taşındı',function(){var h2=habitById(dh.id);if(h2){delete h2.deleted;persist('habits');render('keep');toast('Geri alındı')}});return}
  if(ds.restore){var rh=habitById(ds.restore);if(rh){delete rh.deleted;persist('habits');render('keep');toast('“'+rh.name.slice(0,26)+'” geri yüklendi')}return}
  if(ds.purge){if(pendingDel!==ds.purge){pendingDel=ds.purge;t.textContent='Emin misin?';return}hardDelete(ds.purge);pendingDel=null;render('keep');toast('Kalıcı olarak silindi');return}
  if(ds.act==='shareHabits'){openShare('habits');return}
  if(ds.act==='shareWork'){openShare('work');return}
  switch(ds.act){
    case'prevM':shiftMonth(-1);return;
    case'nextM':shiftMonth(1);return;
    case'thisM':var back=(cy*12+cm)>(now.getFullYear()*12+now.getMonth());cy=now.getFullYear();cm=now.getMonth();render(back?'in-l':'in-r');return;
    case'prevY':yy--;render('in-l');return;
    case'nextY':yy++;render('in-r');return;
    case'toggleAdd':addOpen=!addOpen;$('addform').classList.toggle('open',addOpen);t.setAttribute('aria-expanded',addOpen);if(addOpen)setTimeout(function(){$('nn').focus()},250);return;
    case'add':submitAdd();return;
    case'wSave':saveWork();return;
    case'pPrev':pEdit=null;pw0().setDate(pweek.getDate()-7);render('in-l');return;
    case'pNext':pw0().setDate(pweek.getDate()+7);render('in-r');return;
    case'pThis':var bk=pw0()>mondayOf(new Date());pweek=mondayOf(new Date());render(bk?'in-l':'in-r');return;
    case'pCopy':var pv=new Date(pw0());pv.setDate(pv.getDate()-7);var pk=weekKeys(pv),ck=weekKeys(pweek),cnt=0;pk.forEach(function(k,i){var src=pget(k);if(src.length){pset(ck[i],pget(ck[i]).concat(src.map(function(x){cnt++;return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:x.t,min:x.min,done:false,src:x.src||''}})))}});render('keep');toast(cnt+' görev kopyalandı');return;
    case'wClear':S.work[dk(wd0())]=0;persist('work');render('keep');toast('Kayıt silindi');return;
    case'wPrev':wd0().setDate(wdate.getDate()-1);render('keep');return;
    case'wNext':var nx=new Date(wd0());nx.setDate(nx.getDate()+1);if(dk(nx)<=todayKey()){wdate=nx;render('keep')}return;
    case'export':if(dl)dl.save({filename:'aliskanlik-yedek-'+todayKey()+'.json',data:JSON.stringify(S,null,1)}).catch(function(){});return;
    case'import':$('impFile').click();return;
  }
}
function submitAdd(){var nn=$('nn');if(!nn)return;if(addHabit(nn.value,$('ng').value,newDays)){newDays=[0,1,2,3,4,5,6];render('keep');var n2=$('nn');if(n2)n2.focus()}}
app.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.goal2){var v=Math.max(0,parseFloat(String(t.value).replace(',','.'))||0);S.coach.goals[exView][t.dataset.goal2]=v;persist('coach');render('keep');toast(v?'Hedef kaydedildi':'Hedef kaldırıldı')}});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();var b=document.querySelector(e.target.dataset.enter);if(b)coachHandle(b,b.dataset);return}if(e.key==='Enter'&&(e.target.id==='pe-t'||e.target.id==='pe-s'||e.target.id==='pe-m')){e.preventDefault();savePEdit();return}
  if(e.key==='Enter'&&(e.target.id==='pmt'||e.target.id==='pmm'||e.target.id==='pms')){e.preventDefault();addPlanMulti();return}
  if(e.key==='Enter'&&(e.target.dataset.pnew||e.target.dataset.pmin||e.target.dataset.psrc)){e.preventDefault();addPlan(e.target.dataset.pnew||e.target.dataset.pmin||e.target.dataset.psrc);return}
  if(e.key==='Enter'&&(e.target.id==='wh'||e.target.id==='wm')){e.preventDefault();saveWork();return}
  if(e.key==='Enter'&&(e.target.id==='nn'||e.target.id==='ng')){e.preventDefault();submitAdd()}});
app.addEventListener('click',function(e){var rg=e.target.closest&&e.target.closest('[data-rsel]');if(rg){rSel=rSel===rg.dataset.rsel?null:rg.dataset.rsel;buzz();var rs=$('resil');if(rs)rs.innerHTML=resilHTML(cy,cm);return}});
app.addEventListener('click',function(e){var g=e.target.closest&&e.target.closest('[data-exsel]');if(!g)return;exSel=exSel===g.dataset.exsel?null:g.dataset.exsel;buzz();render('keep')});
app.addEventListener('input',function(e){var t=e.target;if(!F)return;
  if(t.dataset.efp){var pp=t.dataset.efp.split('|');F.parts[pp[0]]=F.parts[pp[0]]||{};F.parts[pp[0]][pp[1]]=t.value;exRefresh()}
  else if(t.id==='ef-date')F.date=t.value;else if(t.id==='ef-pub')F.pub=t.value;else if(t.id==='ef-q'){F.q=Math.max(1,parseInt(t.value,10)||0);exRefresh()}});
app.addEventListener('change',function(e){
  var t=e.target,ds=t.dataset;
  if(ds.rename){var v=t.value.trim();if(!v){render('keep');return}S.habits.forEach(function(h){if(h.id===ds.rename)h.name=v.slice(0,60)});persist('habits');toast('Kaydedildi')}
  else if(ds.goal){var g=Math.max(1,Math.min(31,parseInt(t.value,10)||20));t.value=g;S.habits.forEach(function(h){if(h.id===ds.goal)h.goal=g});persist('habits');toast('Hedef güncellendi')}
  else if(t.id==='impFile'&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){try{var p=JSON.parse(r.result);if(!p||!Array.isArray(p.habits))throw 0;
    S.habits=p.habits;S.months=p.months||{};S.work=p.work||{};S.plan=p.plan||{};S.exams=p.exams||[];S.topics=p.topics||S.topics;S.daily=p.daily||{};S.coach=p.coach||S.coach;norm();persist('exams');persist('topics');persist('coach');Object.keys(S.daily).forEach(function(k){persist('d-'+k)});persist('habits');persist('work');Object.keys(S.plan).forEach(function(k){persist('p-'+k)});Object.keys(S.months).forEach(function(k){persist('m-'+k)});render('keep');toast('Yedek yüklendi')}catch(err){toast('Bu dosya bir Alışkanlık Defteri yedeği değil')}};r.readAsText(t.files[0])}
});
/* reliable taps on touch screens */
function doCell(t){if(t.disabled)return;var on=toggle(cy,cm,+t.dataset.d,t.dataset.cell);t.setAttribute('aria-pressed',on);if(!on)toast('İşaret kaldırıldı');else motivate(t.dataset.cell,cy,cm,+t.dataset.d,false);updateMonth()}
var pd=null,lastPtr=0;
app.addEventListener('pointerdown',function(e){var gp=e.target.closest('.grip');if(gp){pd=null;var it=gp.closest('.hrowt,tr[data-hid]');if(it)startDrag(e,it);return}if(e.pointerType==='mouse'){pd=null;return}var c=e.target.closest('button');pd=(c&&!c.disabled&&c.dataset.act!=='import')?{c:c,x:e.clientX,y:e.clientY}:null});
