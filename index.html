<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HABYT</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HABYT">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700;800;900&family=Red+Hat+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --p{syntax:'<number>';inherits:false;initial-value:0}
:root{
  --bg:#EEF2EC;--surface:#FFFFFF;--head:#E3EBE0;--ink:#1E2A22;--muted:#5E6E63;--line:#D3DDD3;
  --accent:#3E7B4F;--accent-ink:#FFFFFF;--bar:#24332A;--danger:#B03A2E;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101612;--surface:#18211B;--head:#1F2B23;--ink:#E6EEE7;--muted:#95A79A;--line:#2A372E;
  --accent:#6FBF84;--accent-ink:#0F1A12;--bar:#C9D8CD;--danger:#FF8F80;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101612;--surface:#18211B;--head:#1F2B23;--ink:#E6EEE7;--muted:#95A79A;--line:#2A372E;
  --accent:#6FBF84;--accent-ink:#0F1A12;--bar:#C9D8CD;--danger:#FF8F80;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Red Hat Text",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1000px;margin:0 auto;padding:20px 16px 56px}
h1{font:700 26px/1.1 "Red Hat Display","Red Hat Text",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
h2{font:600 20px/1.2 "Red Hat Display","Red Hat Text",system-ui,sans-serif;margin:0}
h3{font:600 15px/1.3 "Red Hat Text",system-ui,sans-serif;margin:0 0 10px}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.sync{color:var(--muted);font-size:12px;margin-top:2px;transition:opacity .3s}
.tabs{position:relative;display:grid;grid-template-columns:repeat(7,1fr);background:var(--head);border-radius:12px;padding:3px;width:100%;max-width:440px}
.tabs .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/7);background:var(--surface);border-radius:9px;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:transform .35s cubic-bezier(.3,1.2,.4,1)}
.tabs button{position:relative;z-index:1;border:0;background:none;padding:8px 4px;cursor:pointer;font-weight:500;color:var(--muted);transition:color .2s;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ink)}
#app.in{animation:fade .28s ease-out}
#app.in-l{animation:slideL .32s cubic-bezier(.2,.8,.2,1)}
#app.in-r{animation:slideR .32s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-24px)}}
@keyframes slideR{from{opacity:0;transform:translateX(24px)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.nav h2{flex:1;text-transform:capitalize}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;cursor:pointer;transition:border-color .15s,transform .1s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.icon{width:38px;padding:8px 0;text-align:center}

/* today */
.strip{position:relative;display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px;margin:0 -4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sday{flex:none;scroll-snap-align:end;display:flex;flex-direction:column;align-items:center;gap:4px;width:46px;border:0;background:none;padding:6px 0;border-radius:12px;cursor:pointer;color:var(--muted);font-size:11px;transition:background .2s}
.sday.sel{background:var(--head);color:var(--ink)}
.mring{--p:0;position:relative;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);transition:--p .5s ease;display:grid;place-items:center}
.mring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--surface)}
.sday.sel .mring::after{background:var(--head)}
.mring b{position:relative;z-index:1;font-size:13px;font-weight:600;color:var(--ink)}
.hero{display:flex;align-items:center;gap:18px;padding:6px 0 2px}
.ring{width:112px;height:112px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.3,1,.4,1)}
.ringwrap{position:relative}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringtxt b{font:700 26px/1 "Red Hat Display","Red Hat Text",system-ui,sans-serif}
.ringtxt span{font-size:11px;color:var(--muted);margin-top:3px}
.dtitle{font:600 20px/1.2 "Red Hat Display","Red Hat Text",system-ui,sans-serif;text-transform:capitalize}
.dsub{color:var(--muted);font-size:14px;margin-top:4px;min-height:21px}
.hlist{display:flex;flex-direction:column;gap:8px}
.hrowt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 12px 12px 16px;cursor:pointer;transition:background .25s,border-color .25s,transform .12s}
.hrowt:active{transform:scale(.985)}
.hrowt[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.hrowt:disabled{opacity:.5;cursor:default}
.hn{flex:1;min-width:0;font-weight:600;font-size:16px;overflow-wrap:anywhere}
.by{font:500 13px/1 "Red Hat Text",system-ui,sans-serif;color:var(--muted);letter-spacing:0;white-space:nowrap}
.streak{flex:none;display:flex;flex-direction:column;align-items:center;min-width:54px;padding:5px 8px;border-radius:10px;background:var(--head);font:700 19px/1.1 "Red Hat Display","Red Hat Text",system-ui,sans-serif;transition:background .25s,color .25s}
.streak small{font:500 10px/1.3 "Red Hat Text",system-ui,sans-serif;color:var(--muted)}
.streak.risk{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}
.streak.risk small{color:var(--danger)}
.streak.zero{opacity:.5}
.hn small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:1px}
.tick{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .25s,border-color .25s}
.tick svg{width:20px;height:20px;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease .05s}
.hrowt[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);animation:pop .3s ease-out}
.hrowt[aria-pressed="true"] .tick svg{stroke-dashoffset:0}
@keyframes pop{40%{transform:scale(1.15)}}
.addbar{margin-top:10px}
.addbtn{width:100%;border:1.5px dashed var(--line);background:none;border-radius:14px;padding:12px;color:var(--muted);cursor:pointer;font-weight:500;transition:border-color .2s,color .2s}
.addbtn:hover{border-color:var(--accent);color:var(--ink)}
.addform{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.addform.open{grid-template-rows:1fr}
.addform>div{overflow:hidden}
.form{display:grid;grid-template-columns:1fr 96px auto;gap:8px;align-items:end;padding-top:10px}
label{font-size:12px;color:var(--muted);display:block}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:3px;transition:border-color .15s}
.inp:focus{border-color:var(--accent);outline:none}

/* month */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--head);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:700 21px/1.2 "Red Hat Display","Red Hat Text",system-ui,sans-serif}
.stat span{color:var(--muted);font-size:12px}
.chart{width:100%;height:84px;display:block;overflow:visible}
.chart rect{transform-box:fill-box;transform-origin:bottom;transition:transform .5s cubic-bezier(.3,1,.4,1),fill .3s}
.chart-cap{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:4px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;scroll-behavior:smooth;overscroll-behavior-x:contain}
.cell{touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:0;text-align:center;font-size:12px;background:var(--surface)}
thead th{background:var(--head);font-weight:600;padding:4px 0}
.wk th{border-left:1px solid var(--line);color:var(--muted);font-weight:500}
.sticky{position:sticky;left:0;z-index:2;text-align:left;padding:6px 10px;min-width:140px;max-width:180px;border-right:1px solid var(--line);font-size:13px;font-weight:500;overflow-wrap:anywhere}
thead .sticky{z-index:3}
.goal{color:var(--muted);min-width:42px;border-right:1px solid var(--line)}
.dh{min-width:32px;line-height:1.15}
.dh small{display:block;color:var(--muted);font-weight:400;font-size:10px}
.dh.today{color:var(--accent)}
.wstart{border-left:1px solid var(--line)}
.cell{width:32px;height:34px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.box{width:20px;height:20px;border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center;background:var(--surface);transition:background .2s,border-color .2s,transform .15s}
@media (hover:hover){.cell:hover .box{border-color:var(--accent)}}
.cell:active .box{transform:scale(.85)}
.cell[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.box svg{width:13px;height:13px;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s ease}
.cell[aria-pressed="true"] .box svg{stroke-dashoffset:0}
.cell[data-fut] .box{border-style:dashed;opacity:.5}
.cell[data-fut][aria-pressed="true"] .box{opacity:.8}
.sday.fut small{opacity:.7}
.cell:disabled{cursor:default}.cell:disabled .box{opacity:.35}
.td-today{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.status{min-width:92px;padding:0 10px;border-left:1px solid var(--line);text-align:left;transition:color .3s}
.mini{height:5px;background:var(--line);border-radius:3px;margin-top:3px;overflow:hidden}
.mini i,.bar i{display:block;height:100%;transition:width .5s cubic-bezier(.3,1,.4,1)}
.mini i{background:var(--accent)}
.status.hit{color:var(--accent);font-weight:600}
tfoot th,tfoot td{color:var(--muted);border-bottom:0;padding:6px 0;background:var(--head)}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.week{background:var(--head);border-radius:12px;padding:10px 12px}
.week .wt{display:flex;justify-content:space-between;font-size:13px}
.week span,.hmeta{color:var(--muted);font-size:12px}
.bar{height:8px;background:var(--line);border-radius:4px;margin:8px 0 4px;overflow:hidden}
.bar i{background:var(--bar)}
.hint{color:var(--muted);font-size:12px;margin:8px 0 0}

/* year */
.ycell{width:100%;min-width:42px;height:34px;border:0;cursor:pointer;font-size:11px;color:var(--ink);border-radius:6px;transition:transform .12s}
.ycell:active{transform:scale(.92)}
.ytab td{padding:3px 2px}
.sum{color:var(--muted);padding:0 10px;min-width:64px}

/* habits */
.hrow{display:grid;grid-template-columns:1fr 76px auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.hacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.danger{color:var(--danger)}
.archived{opacity:.55}
.empty{text-align:center;padding:24px 8px}
.empty p{color:var(--muted);margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--head);border-radius:999px;padding:7px 14px;cursor:pointer;transition:border-color .15s,transform .1s}
.chip:hover{border-color:var(--accent)}.chip:active{transform:scale(.95)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--bar);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;transition:opacity .25s,transform .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:620px){
  .stat b{font-size:17px}
  .form{grid-template-columns:1fr 84px}.form .btn{grid-column:1/-1}
  .hrow{grid-template-columns:1fr 70px}.hacts{grid-column:1/-1;justify-content:flex-start}
  .sticky{min-width:112px}
  .ring{width:96px;height:96px}
}
@media (pointer:coarse){
  .cell{width:46px;height:48px}
  .box{width:30px;height:30px;border-radius:9px;border-width:2px}
  .box svg{width:19px;height:19px}
  .dh{min-width:46px;font-size:13px}
  .sticky{font-size:14px}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== visual refresh ===== */
:root{--accent2:#8FCF9C;--flame:#E07A3A;--shadow:0 1px 2px rgba(25,45,30,.05),0 10px 28px -14px rgba(25,45,30,.22);--glass:rgba(255,255,255,.72)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent2:#B4EFC0;--flame:#FF9B5E;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -16px rgba(0,0,0,.75);--glass:rgba(24,33,27,.72)}}
:root[data-theme="dark"]{--accent2:#B4EFC0;--flame:#FF9B5E;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -16px rgba(0,0,0,.75);--glass:rgba(24,33,27,.72)}
body{background:radial-gradient(900px 420px at 50% -160px,color-mix(in srgb,var(--accent) 16%,var(--bg)),var(--bg) 70%) no-repeat,var(--bg);min-height:100%}

.sync{margin-top:6px}
.top{margin-bottom:20px}
.panel{border:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.panel.plain{background:none;border:0;box-shadow:none;padding:0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs{pointer-events:auto;max-width:460px;padding:6px;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 12px 32px -12px rgba(0,0,0,.35)}
.tabs .pill{top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/7);border-radius:16px;background:color-mix(in srgb,var(--accent) 16%,var(--surface));box-shadow:none}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;font-size:12px;font-weight:600}

.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs button[aria-selected="true"] svg{transform:translateY(-1px) scale(1.08)}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px));border-radius:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
/* today hero */

.ring{width:168px;height:168px}
.ring circle{stroke-width:9}
.ring .bgc{stroke:color-mix(in srgb,var(--line) 80%,transparent)}
.ring .fg{stroke:url(#rg)}
.ringwrap{border-radius:50%;transition:filter .5s}
.ringwrap.done{animation:glow 1.2s ease-out}
.ringwrap.done .fg{stroke:var(--accent)}
@keyframes glow{0%{filter:drop-shadow(0 0 0 transparent)}40%{filter:drop-shadow(0 0 18px color-mix(in srgb,var(--accent) 70%,transparent))}100%{filter:drop-shadow(0 0 0 transparent)}}
.ringtxt b{font-size:38px;letter-spacing:-.02em}
.ringtxt b.bump{animation:bump .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes bump{40%{transform:scale(1.14)}}
.dtitle{font-size:22px}
.strip{gap:4px;padding-bottom:6px;margin-bottom:6px}
.sday{width:48px;border-radius:16px;padding:7px 0 8px;font-weight:500}
.sday.sel{background:var(--accent);color:var(--accent-ink)}

/* ===== purple palette & motivation ===== */
:root{--bg:#F3F0F9;--surface:#FFFFFF;--head:#ECE6F7;--ink:#211933;--muted:#6B6281;--line:#DCD3EC;--accent:#6B3FD4;--accent-ink:#FFFFFF;--bar:#2C2142;--accent2:#B9A2F5;--danger:#C2364A;--flame:#E9793A;--shadow:0 1px 2px rgba(45,25,80,.06),0 12px 30px -14px rgba(60,30,110,.28);--glass:rgba(255,255,255,.74)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#100C19;--surface:#1A1427;--head:#241C35;--ink:#EDE8F8;--muted:#A69CBC;--line:#30273F;--accent:#A88BFF;--accent-ink:#170F27;--bar:#D8CDF0;--accent2:#DCCFFF;--danger:#FF8A9A;--flame:#FF9F62;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -16px rgba(0,0,0,.8);--glass:rgba(26,20,39,.74)}}
:root[data-theme="dark"]{--bg:#100C19;--surface:#1A1427;--head:#241C35;--ink:#EDE8F8;--muted:#A69CBC;--line:#30273F;--accent:#A88BFF;--accent-ink:#170F27;--bar:#D8CDF0;--accent2:#DCCFFF;--danger:#FF8A9A;--flame:#FF9F62;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -16px rgba(0,0,0,.8);--glass:rgba(26,20,39,.74)}
body{background:radial-gradient(1000px 460px at 50% -170px,color-mix(in srgb,var(--accent) 22%,var(--bg)),var(--bg) 72%) no-repeat,var(--bg)}
.brand{font:700 15px/1.2 "Red Hat Display","Red Hat Text",system-ui,sans-serif;color:var(--accent);margin-bottom:6px}
.brand .by{display:inline;margin:0 0 0 4px;font-size:12px;font-weight:500}
h1#dateTitle{font-size:32px;min-height:1.1em}
.quote{margin:10px auto 0;max-width:420px;font-size:14px;line-height:1.5;color:var(--ink);opacity:.85;font-style:italic;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.toast.cheer{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--flame)));color:#fff;font-weight:600;max-width:calc(100% - 32px);text-align:center;padding:12px 18px;box-shadow:0 14px 34px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
.toast.cheer.show{animation:cheer .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes cheer{0%{transform:translate(-50%,20px) scale(.9)}100%{transform:translate(-50%,0) scale(1)}}
@media (max-width:620px){h1#dateTitle{font-size:26px}}
/* coach module */
.wsec{border-top:1px dashed var(--line);padding-top:12px}
.wrow{display:flex;gap:8px;margin-top:6px}.wrow select{flex:1;min-width:0;margin:0}.wrow #ef-wn{width:70px;margin:0;text-align:center}.wrow .btn{width:44px;padding:0;font-size:22px;box-shadow:none}
.wtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wtag{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:8px;background:var(--head);font-size:13px;border-left:3px solid var(--muted)}
.wtag small{color:var(--muted);font-size:11px}.wtag button{border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 6px}
.wtag.r-bilgi,.rbar .r-bilgi{border-color:var(--accent)}.rbar .r-bilgi{background:var(--accent)}
.wtag.r-dikkat{border-color:var(--flame)}.rbar .r-dikkat{background:var(--flame)}
.wtag.r-sure{border-color:var(--danger)}.rbar .r-sure{background:var(--danger)}
.wtag.r-yorum{border-color:#2E9E5B}.rbar .r-yorum{background:#2E9E5B}
.extgt{stroke:#2E9E5B;stroke-width:2;stroke-dasharray:8 5}.extgl{font-size:12px;fill:#2E9E5B;font-weight:700;font-family:"Red Hat Text",system-ui,sans-serif}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.grow{display:grid;grid-template-columns:1fr 90px;gap:4px 10px;align-items:center;background:var(--head);border-radius:8px;padding:10px 12px}
.grow b{display:block;font-size:14px}.grow small{font-size:11px;color:var(--muted)}.grow .inp{margin:0;text-align:center;font-weight:700}
.gbar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.gbar i{display:block;height:100%;background:#2E9E5B}
.heat{display:flex;flex-direction:column;gap:2px}
.hrow3{display:grid;grid-template-columns:minmax(120px,1.2fr) 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.hrow3:first-child{border-top:0}.hn3 b{display:block;font-size:14px}.hn3 small{font-size:11px;color:var(--muted)}
.hbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.hbar i{display:block;height:100%;background:var(--danger)}
.hcount{font:800 18px/1 "Red Hat Display","Red Hat Text",system-ui,sans-serif;color:var(--danger);min-width:22px;text-align:right}
.hrow3 .btn{padding:6px 10px;font-size:12px}
.reasons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;margin-top:14px}
.reasons div{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;font-size:12px}.reasons span{color:var(--muted);font-weight:600}
.rbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.rbar i{display:block;height:100%}
.recov{border-left:4px solid var(--flame)}.rlead{margin:0 0 8px}.rlist{margin:0 0 12px;padding-left:20px}.rlist li{margin:4px 0}.rlist small{color:var(--muted)}
.rtip{margin:12px 0 0;font-size:13px;color:var(--muted)}
.duebadge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:6px;background:var(--danger);color:#fff;font-size:11px;letter-spacing:.04em}
.errlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.erritem{padding:12px;border-radius:10px;background:var(--head);border-left:3px solid var(--line)}
.erritem.due{border-left-color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--head))}
.ehead b{display:block;font-size:15px}.ehead span{font-size:12px;color:var(--muted)}
.erritem p{margin:8px 0;font-size:14px;white-space:pre-wrap}
textarea.inp{resize:vertical;font:inherit;min-height:70px}
.fpanel.running{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent),var(--shadow)}
.ftime{display:flex;align-items:center;justify-content:center;gap:22px;margin:16px 0 8px}
.fring{width:120px;height:120px;transform:rotate(-90deg)}.frbg{fill:none;stroke:var(--line);stroke-width:8}.frfg{fill:none;stroke:var(--accent);stroke-width:8;transition:stroke-dashoffset 1s linear}
.ftime b{display:block;font:800 56px/1 "Red Hat Display","Red Hat Text",system-ui,sans-serif;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.ftime span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.fbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.fbtns .btn{padding:11px 20px}
.dist{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;font-size:13px}.drow span{font-weight:600}.drow b{font-size:13px;white-space:nowrap}
.dbar{height:12px;border-radius:4px;background:var(--line);overflow:hidden}.dbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.dbar.acc i{background:linear-gradient(90deg,#7ed6a0,#2E9E5B)}.drow.un .dbar i{background:var(--muted);opacity:.5}
.qform{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:10px}.qform .btn.primary{padding:15px 22px}
.checkin{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}
.stepper{display:flex;align-items:center;gap:10px;margin-top:4px}.stepper b{font:700 22px/1 "Red Hat Display","Red Hat Text",system-ui,sans-serif;min-width:64px;text-align:center}
.energy{display:flex;gap:6px;margin-top:4px}.energy button{flex:1;font-size:22px;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;filter:grayscale(.8);opacity:.7;transition:all .2s}
.energy button[aria-pressed="true"]{filter:none;opacity:1;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));transform:scale(1.06)}
.coach{border-left:4px solid var(--accent)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px}.chead h3{margin:0}
.phase{font:700 13px/1 "Red Hat Display","Red Hat Text",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;padding:6px 10px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.ptip{margin:10px 0 12px;font-size:14px;color:var(--muted)}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--head);font-size:14px}.tip span{flex:1}.tip .btn{padding:6px 10px;font-size:12px;white-space:nowrap}
.report{margin-top:12px;display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:1fr auto 18px;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.rrow span{font-weight:600;font-size:14px}.rrow b{font:700 18px/1 "Red Hat Display","Red Hat Text",system-ui,sans-serif;text-align:right}.rrow em{font-style:normal;font-size:12px}.rrow small{grid-column:1/-1;font-size:11px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{padding:12px;border-radius:10px;background:var(--head);text-align:center;opacity:.5;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;background:color-mix(in srgb,#F5C518 14%,var(--head));box-shadow:inset 0 0 0 1px color-mix(in srgb,#F5C518 50%,transparent)}
.badge i{display:block;font-style:normal;font-size:26px}.badge b{display:block;font-size:13px;margin-top:4px}.badge small{font-size:11px;color:var(--muted)}
@media (max-width:620px){.hrow3{grid-template-columns:1fr auto auto}.hbar{grid-column:1/-1;grid-row:2}.reasons{grid-template-columns:1fr}.checkin{grid-template-columns:1fr}.qform{grid-template-columns:1fr 1fr}.qform .btn{grid-column:1/-1}.ftime b{font-size:46px}.drow{grid-template-columns:80px 1fr auto}}

/* topics */
.calseg{margin:0 0 12px}.calseg .pr{padding:8px 22px;font-size:14px;font-weight:600}
.tbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:10px}
.tbar i{display:block;height:100%;transition:width .5s cubic-bezier(.3,1,.4,1)}
.tbar .b3,.tchip.s3,.tlegend .s3{background:#2E9E5B}
.tbar .b2,.tchip.s2,.tlegend .s2{background:var(--accent)}
.tbar .b1,.tchip.s1,.tlegend .s1{background:var(--flame)}
.tlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.tlegend span{display:inline-flex;align-items:center;gap:5px}.tlegend i{width:10px;height:10px;border-radius:3px}.tlegend .s0{background:var(--line)}.tlegend b{color:var(--ink)}
.tstatus{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--flame) 12%,transparent);font-weight:600;font-size:14px}
.tstatus.ok{background:color-mix(in srgb,#2E9E5B 14%,transparent)}
.tsub{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.thead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit}
.tname{flex:1}.tname b{display:block;font:700 18px/1.2 "Red Hat Display","Red Hat Text",system-ui,sans-serif;letter-spacing:.02em}.tname small{font-size:12px;color:var(--muted)}
.tpct{font:800 22px/1 "Red Hat Display","Red Hat Text",system-ui,sans-serif;color:var(--accent)}
.chev{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2;transition:transform .25s}
.tsub.open .chev{transform:rotate(180deg)}
.tlist{margin-top:10px;display:flex;flex-direction:column}
.trow2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border:0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);background:none;text-align:left;color:inherit;font-size:15px;cursor:pointer}
.trow2:active{background:var(--head)}
.tchip{flex:none;font-style:normal;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:6px;color:#fff;transition:background .25s}
.tchip.s0{background:var(--head);color:var(--muted)}
.tchip.s1{color:#1a1200}
/* resilience */
.rsbar{fill:color-mix(in srgb,var(--accent) 22%,transparent)}
/* exams */
.exseg{margin-bottom:10px}.exseg .pr{padding:8px 18px;font-size:14px}
.exchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stats.ex4{grid-template-columns:repeat(4,1fr)}
.stat em{font-style:normal;font-size:13px;font-weight:700;margin-left:6px;vertical-align:middle}
em.up{color:#2E9E5B}em.down{color:var(--danger)}
.exchart{position:relative;margin-top:4px}
.exchart svg{display:block;width:100%;height:auto;overflow:visible}
.exgl{stroke:color-mix(in srgb,var(--line) 80%,transparent);stroke-dasharray:3 5}
.exyl{font-size:12px;fill:var(--muted);font-family:"Red Hat Text",system-ui,sans-serif}
.exline{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.exavg{stroke:var(--flame);stroke-width:1.6;stroke-dasharray:6 6;opacity:.8}
.exdot{cursor:pointer}.exc{fill:var(--surface);stroke:var(--accent);stroke-width:3;transition:r .2s}
.exdot.sel .exc{fill:var(--accent)}
.exbub{position:absolute;transform:translate(var(--tx,-50%),calc(-100% - 14px));background:var(--bar);color:var(--surface);padding:8px 12px;border-radius:12px;white-space:nowrap;pointer-events:none;box-shadow:0 10px 24px -10px rgba(0,0,0,.45);animation:fade .25s}
.exbub b{font:700 17px/1.2 "Red Hat Display","Red Hat Text",system-ui,sans-serif}
.exbub em{margin-left:6px;font-style:normal;font-weight:700;font-size:13px;color:inherit;opacity:.85}.exbub em.up::before{content:'▲ ';font-size:10px}.exbub em.down::before{content:'▼ ';font-size:10px}
.exbub small{display:block;font-size:11px;opacity:.8}
.exform{display:grid;gap:12px;padding-top:12px}
.exrow3{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}
.exrow3 #ef-q{width:110px}
.extable{border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:16px;overflow:hidden}
.exth,.extr{display:grid;grid-template-columns:minmax(90px,1.4fr) 1fr 1fr .7fr .8fr;gap:8px;align-items:center;padding:8px 12px}
.exth{background:var(--head);font-size:12px;font-weight:600;color:var(--muted)}
.exth span:not(:first-child){text-align:center}
.extr+.extr{border-top:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.extr b{display:block;font-size:14px}.extr small{font-size:11px;color:var(--muted)}
.extr .inp{margin:0;text-align:center;padding:9px 6px;font-weight:600}
.exb,.exn{text-align:center;font-weight:600}
.exb{color:var(--muted)}.exb.bad{color:var(--danger)}
.exn{color:var(--accent);font:700 16px/1 "Red Hat Display","Red Hat Text",system-ui,sans-serif}
.extot{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}.extot .exn{font-size:20px}
.excard{padding:12px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);transition:background .3s}
.excard:first-of-type{border-top:0}
.excard.sel{background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:14px;padding:12px;margin:0 -12px}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.exhead b{display:block;font:600 16px/1.2 "Red Hat Display","Red Hat Text",system-ui,sans-serif}.exhead span{font-size:12px;color:var(--muted)}
.exnet{font:700 26px/1 "Red Hat Display","Red Hat Text",system-ui,sans-serif;color:var(--accent);text-align:right}.exnet small{display:block;font:500 11px "Red Hat Text",system-ui,sans-serif;color:var(--muted)}
.exparts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.exparts span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--head);color:var(--muted)}.exparts b{color:var(--ink)}
@media (max-width:620px){.stats.ex4{grid-template-columns:1fr 1fr}.exrow3{grid-template-columns:1fr 1fr}.exth,.extr{gap:5px;padding:8px}}
/* drag & tiers */
.grip{flex:none;display:grid;place-items:center;width:26px;height:40px;margin:-6px 0 -6px -10px;color:var(--muted);cursor:grab;touch-action:none;border-radius:8px;opacity:.7}
.grip svg{width:18px;height:18px;fill:currentColor}
.grip:active{cursor:grabbing}
.hrowt{background:color-mix(in srgb,var(--hc,var(--surface)) 20%,var(--surface));border-color:color-mix(in srgb,var(--hc,var(--line)) 45%,transparent);transition:background .5s,border-color .5s,transform .12s,box-shadow .2s}
.hrowt::before{background:var(--hc,var(--accent));transform:scaleY(1);width:6px}
.hrowt[data-tier="0"]::before{transform:scaleY(0)}
.hrowt[aria-pressed="true"]{background:color-mix(in srgb,var(--hc,var(--accent)) 32%,var(--surface));border-color:color-mix(in srgb,var(--hc,var(--accent)) 60%,transparent)}
.streak{background:color-mix(in srgb,var(--hc,var(--flame)) 24%,var(--surface))}
.streak .tn{font-size:10px}
.hrowt.dragging{z-index:5;position:relative;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);transform:scale(1.02);transition:box-shadow .2s;opacity:1}
body.is-dragging{-webkit-user-select:none;user-select:none}
body.is-dragging .hrowt:not(.dragging){transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.mname{display:flex;align-items:center;gap:6px}
.mname .grip{width:22px;height:30px;margin:-4px 0 -4px -6px}
.tdot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--hc);box-shadow:0 0 0 2px color-mix(in srgb,var(--hc) 30%,transparent)}
tr.dragging th,tr.dragging td{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
tr.dragging{position:relative;z-index:4}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 15%,transparent)}
.legend b{font-weight:600;color:var(--ink);opacity:.7}
/* trash, undo, share */
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.trow:first-of-type{border-top:0}
.trow b{display:block;font-weight:600}.trow span{font-size:12px;color:var(--muted)}
.undo{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:25;display:flex;align-items:center;gap:14px;background:var(--bar);color:var(--surface);padding:12px 12px 12px 18px;border-radius:16px;box-shadow:0 14px 34px -12px rgba(0,0,0,.5);overflow:hidden;max-width:calc(100% - 32px);transition:opacity .25s,transform .3s cubic-bezier(.3,1.3,.5,1)}
.undo.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.undo span{font-size:14px}
.undo button{flex:none;border:0;border-radius:10px;background:var(--accent2);color:#1A1130;font-weight:700;padding:8px 14px;cursor:pointer}
.undo i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent2);transform-origin:left}
.undo.show i{animation:undobar 3s linear forwards}
@keyframes undobar{to{transform:scaleX(0)}}
.sharebtn{display:inline-flex;align-items:center;gap:8px;margin-top:14px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--accent);font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;transition:transform .12s,background .2s}
.sharebtn:active{transform:scale(.95)}
.sharebtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(10,6,20,0);transition:background .25s}
.sheet.open{background:rgba(10,6,20,.55)}
.sheet[hidden]{display:none}
.sheet-card{width:100%;max-width:440px;background:var(--surface);border-radius:26px;padding:16px;box-shadow:0 20px 50px -10px rgba(0,0,0,.5);transform:translateY(40px);opacity:0;transition:transform .35s cubic-bezier(.2,1.1,.3,1),opacity .25s;margin-top:env(safe-area-inset-top,0px)}
.sheet.open .sheet-card{transform:none;opacity:1}
.sheet-card img{display:block;width:100%;max-height:62vh;object-fit:contain;border-radius:18px;-webkit-touch-callout:default}
.sheet-hint{font-size:12px;color:var(--muted);text-align:center;margin:10px 0}
.sheet-btns{display:flex;gap:8px}.sheet-btns .btn{flex:1;padding:12px}
/* plan */
button.ptext{border:0;background:none;padding:2px 0;text-align:left;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit;font-size:15px}
.psrc{display:flex;flex-wrap:wrap;gap:4px}
.psrc i{font-style:normal;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px 2px 6px;border-radius:999px;background:var(--head);color:var(--muted)}
.psrc svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pitem.done .psrc{opacity:.6}
.pitem.done button.ptext>span:first-child{text-decoration:line-through;color:var(--muted)}
.pitem.done button.ptext{text-decoration:none;color:inherit}
.psrcin{flex:0 1 150px;min-width:90px}
.pediting{padding:10px 0}
.pedit{flex:1;display:flex;flex-direction:column;gap:8px}
.pedit .inp{margin-top:0}
.pedit .padd .inp:first-child{flex:1}
.pebtns{display:flex;justify-content:flex-end;gap:8px}
@media (max-width:620px){.padd{flex-wrap:wrap}.padd .inp:first-child{flex:1 1 100%}.psrcin{flex:1 1 auto}}
.pmulti .padd{margin-bottom:4px}
.pmrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pmrow .daypick{flex:1}
.pmrow .btn.primary{padding:10px 20px;white-space:nowrap}
.tabs{max-width:520px}
.tabs button{font-size:10px;padding-left:1px;padding-right:1px;letter-spacing:-.01em}
.tabs{max-width:600px}
.tabs svg{width:20px;height:20px}
.pbar{margin-top:14px;height:8px}.pbar i{background:linear-gradient(90deg,var(--accent2),var(--accent))}
.pday{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:22px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);scroll-margin-top:16px}
.pday.today{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent),var(--shadow)}
.pday.past{opacity:.85}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.phead b{display:block;font:600 17px/1.2 "Red Hat Display","Red Hat Text",system-ui,sans-serif}
.pday.today .phead b{color:var(--accent)}
.phead span{font-size:13px;color:var(--muted)}
.pmeta{text-align:right;font:700 17px/1.1 "Red Hat Display","Red Hat Text",system-ui,sans-serif;padding:6px 10px;border-radius:12px;background:var(--head)}
.pmeta small{display:block;font:500 11px/1.3 "Red Hat Text",system-ui,sans-serif;color:var(--muted)}
.pmeta.alldone{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
.plist{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:12px;transition:background .2s}
.pitem+.pitem{border-top:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.pchk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;padding:0;transition:background .2s,border-color .2s}
.pchk svg{width:16px;height:16px;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s}
.pitem.done .pchk{background:var(--accent);border-color:var(--accent);animation:pop .3s ease-out}
.pitem.done .pchk svg{stroke-dashoffset:0}
.ptext{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere;transition:color .2s}
.pitem.done .ptext{text-decoration:line-through;color:var(--muted)}
.pmin{flex:none;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);white-space:nowrap}
.pitem.done .pmin{opacity:.55}
.pdel{flex:none;width:30px;height:30px;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;border-radius:8px;cursor:pointer}
@media (hover:hover){.pdel:hover{color:var(--danger);background:var(--head)}}
.padd{display:flex;gap:8px;align-items:stretch}
.padd .inp{margin-top:0;padding:10px 12px;font-size:14px}
.padd .inp:first-child{flex:1;min-width:0}
.pminin{width:72px;flex:none;text-align:center}
.padd .btn.primary{width:44px;padding:0;font-size:22px;line-height:1;flex:none;box-shadow:none}
/* work */
.tabs button{font-size:11px}
.wnav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.wday{flex:1;text-align:center;line-height:1.25}.wday b{display:block;font:600 18px/1.2 "Red Hat Display","Red Hat Text",system-ui,sans-serif}.wday span{font-size:13px;color:var(--muted)}
.wform{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.wbig{font:700 26px/1.2 "Red Hat Display","Red Hat Text",system-ui,sans-serif;text-align:center;padding:12px}
.wform .btn.primary{padding:15px 24px}
.wquick{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.wcur{margin:12px 0 0;color:var(--muted);font-size:14px}.wcur b{color:var(--accent)}
.seg{display:flex;gap:6px}
.wchart{position:relative;height:240px;margin:58px 0 0 34px}
.wgrid{position:absolute;inset:0 0 22px 0}
.gl{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--line) 80%,transparent)}
.gl span{position:absolute;right:100%;margin-right:6px;transform:translateY(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.wbars{position:absolute;inset:0;display:flex;align-items:stretch;gap:8px}
.wchart.dense .wbars{gap:3px}
.wbar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border:0;background:none;padding:0;cursor:pointer;position:relative}
.wbar::before{content:"";position:absolute;inset:0 -2px 22px;border-radius:10px;background:transparent;transition:background .2s}
.wbar.sel::before{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.col{position:relative;display:block;width:100%;max-width:44px;margin-bottom:22px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--accent2),var(--accent));transform-origin:bottom;transition:height .5s cubic-bezier(.3,1,.4,1),filter .2s}
.wchart.dense .col{border-radius:5px 5px 2px 2px}
.col.cempty{background:var(--line)}
.wbar:not(.sel) .col{filter:saturate(.75) opacity(.8)}
.wbar.today .bl{color:var(--accent);font-weight:700}
#app.in .col,#app.in-l .col,#app.in-r .col{animation:grow .6s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0)*25ms)}
@keyframes grow{from{transform:scaleY(0)}}
.bl{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap;line-height:22px}
.bub{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--bar);color:var(--surface);padding:7px 11px;border-radius:12px;font:700 14px/1.2 "Red Hat Display","Red Hat Text",system-ui,sans-serif;white-space:nowrap;text-align:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);animation:bubin .3s cubic-bezier(.3,1.4,.5,1);z-index:3;pointer-events:none}
.bub small{display:block;font:500 11px/1.3 "Red Hat Text",system-ui,sans-serif;opacity:.8}
.bub::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--bar)}
.wbar:first-child .bub{left:0;transform:none}.wbar:first-child .bub::after{left:14px}
.wbar:last-child .bub{left:auto;right:0;transform:none}.wbar:last-child .bub::after{left:auto;right:8px}
@keyframes bubin{from{opacity:0;transform:translate(-50%,6px) scale(.9)}}
@media (max-width:620px){.wform{grid-template-columns:1fr 1fr}.wform .btn{grid-column:1/-1}.wchart{height:200px}}
/* schedule */
.form2{display:grid;gap:14px;padding-top:10px}
.frow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
#goalWrap{width:150px}
.frow .btn.primary{margin-left:auto;padding:11px 26px}
.schednote{flex:1;min-width:180px;font-size:13px;color:var(--muted);padding-bottom:10px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.pr{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--head);color:var(--ink);font-size:13px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.pr[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.daypick{display:flex;gap:5px;flex-wrap:wrap}
.dp{min-width:42px;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .12s}
.dp:active{transform:scale(.92)}
.dp[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hrow .daypick{margin-top:8px}.hrow .dp{min-width:36px;padding:5px 0;font-size:12px;border-radius:10px}
.autogoal{text-align:center;line-height:1.1}.autogoal b{display:block;font:700 20px/1.1 "Red Hat Display","Red Hat Text",system-ui,sans-serif}.autogoal span{font-size:11px;color:var(--muted)}
.sublabel{font-size:13px;font-weight:600;color:var(--muted);margin:10px 4px 0}
.hrowt.off{opacity:.62;box-shadow:none}
.hrowt.off[aria-pressed="true"]{opacity:1}
td.off{background:color-mix(in srgb,var(--head) 55%,var(--surface))}
td.off .cell:not([aria-pressed="true"]) .box{opacity:.35;border-style:dotted}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== PREMIUM THEME: midnight navy & gold (from the logo) ===== */
:root{--bg:#EDF0F6;--surface:#FFFFFF;--head:#F0F2F8;--ink:#0D1838;--muted:#5F6B88;--line:#DCE1EC;--accent:#14296B;--accent-ink:#FFFFFF;--accent2:#4A64B8;--bar:#0D1838;--danger:#C9403D;--flame:#B8862B;--gold:#B8862B;--ok:#23915A;--prog:#D59A2A;
  --hair:rgba(13,24,56,.07);--glass:rgba(255,255,255,.82);--float:0 22px 44px -22px rgba(13,24,56,.38);--shadow:none;--page:linear-gradient(180deg,#E3E8F3 0,#EDF0F6 380px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1533;--surface:#12204A;--head:#1A2B5C;--ink:#F2EEE3;--muted:#9AA6C4;--line:#263A72;--accent:#D8B36A;--accent-ink:#0B1533;--accent2:#F1DCA8;--bar:#F2EEE3;--danger:#FF7C76;--flame:#F2B95A;--gold:#D8B36A;--ok:#58C794;--prog:#8DA6F2;
  --hair:rgba(255,255,255,.07);--glass:rgba(18,32,74,.8);--float:0 24px 48px -20px rgba(2,6,20,.8);--shadow:none;--page:linear-gradient(180deg,#10204D 0,#0B1533 420px)}}
:root[data-theme="dark"]{--bg:#0B1533;--surface:#12204A;--head:#1A2B5C;--ink:#F2EEE3;--muted:#9AA6C4;--line:#263A72;--accent:#D8B36A;--accent-ink:#0B1533;--accent2:#F1DCA8;--bar:#F2EEE3;--danger:#FF7C76;--flame:#F2B95A;--gold:#D8B36A;--ok:#58C794;--prog:#8DA6F2;
  --hair:rgba(255,255,255,.07);--glass:rgba(18,32,74,.8);--float:0 24px 48px -20px rgba(2,6,20,.8);--shadow:none;--page:linear-gradient(180deg,#10204D 0,#0B1533 420px)}

/* type */
body{font:400 15px/1.5 "Red Hat Text",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page) no-repeat,var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
main{max-width:720px;padding:22px 20px calc(132px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.dtitle,.ringtxt b,.stat b,.wday b,.phead b,.exhead b,.exnet,.streak,.autogoal b,.wbig,.exn,.pmeta,.tname b,.tpct,.yksbig b,.yksbig span,.yksrow b,.ftime b,.hn,.hcount,.rrow b,.stepper b,.brand,.pagedesc b,.exbub b,.bub{font-family:"Red Hat Display","Red Hat Text",system-ui,sans-serif}
h2{font-weight:800;font-size:22px;line-height:1.2;letter-spacing:-.015em;text-transform:none}
h3{font-weight:700;font-size:16px;line-height:1.3;letter-spacing:-.005em;text-transform:none;color:var(--ink);margin:0 0 14px}
label{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.hint{font-size:12.5px;line-height:1.5;color:var(--muted);text-align:left;margin:12px 0 0}
.stat span,.exth,.sublabel,.legend,.week .wt b,.yksrow span,.ftime span,.phase,.tchip,.addbtn,.sharebtn,.btn.primary,.tabs button{text-transform:none;letter-spacing:0}

/* header */
.top{display:block;margin-bottom:24px}
.top>div{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px}
.brandrow{grid-column:1;display:flex;align-items:center;gap:16px;margin:0}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:7px;margin:0;font-weight:900;font-size:34px;line-height:1;letter-spacing:.2em;text-transform:none;
  background:linear-gradient(100deg,var(--accent2),var(--gold) 60%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .by{display:block;margin:0;font:500 12px/1 "Red Hat Text",system-ui,sans-serif;letter-spacing:.02em;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.brand{background-image:linear-gradient(100deg,#C9A254,#8C6A1E)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand{background-image:linear-gradient(100deg,#F6E7C2,#D8B36A 70%)}}
:root[data-theme="dark"] .brand{background-image:linear-gradient(100deg,#F6E7C2,#D8B36A 70%)}
h1#dateTitle{grid-column:1/-1;margin:14px 0 0;font-weight:700;font-size:17px;line-height:1.3;letter-spacing:0;text-transform:none;color:var(--ink);min-height:0}
.sync{grid-column:1/-1;display:flex;align-items:center;gap:7px;margin:2px 0 0;font-size:12px;color:var(--muted)}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.logowrap{position:relative;flex:none;width:78px;height:78px;border-radius:22px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;
  box-shadow:0 0 0 1.5px rgba(214,175,98,.6),var(--float);animation:logoin .9s cubic-bezier(.2,1.3,.3,1) both}
.logo{display:block;width:100%;height:100%}
.logowrap::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,236,190,.5) 50%,transparent 58%);transform:translateX(-120%);animation:logoshine 7s ease-in-out 1.6s infinite;pointer-events:none;mix-blend-mode:screen}
.logowrap.ready{animation:logoglow 6s ease-in-out infinite}
.logowrap.spin,.logowrap.ready.spin{animation:logospin .8s cubic-bezier(.3,1.4,.5,1)}
@keyframes logoin{0%{opacity:0;transform:scale(.5) rotate(-20deg);filter:blur(8px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes logoglow{0%,100%{box-shadow:0 0 0 1.5px rgba(214,175,98,.6),var(--float),0 0 0 0 rgba(214,175,98,0)}50%{box-shadow:0 0 0 1.5px rgba(214,175,98,.95),var(--float),0 0 22px 1px rgba(214,175,98,.3)}}
@keyframes logoshine{0%,60%{transform:translateX(-120%)}82%,100%{transform:translateX(120%)}}
@keyframes logospin{0%{transform:none}35%{transform:scale(.88) rotate(-8deg)}100%{transform:scale(1) rotate(360deg)}}
.yks{grid-column:2;grid-row:1;justify-self:end;display:inline-flex;align-items:baseline;gap:5px;margin:0;padding:10px 16px;border:0;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--hair);color:var(--muted);font:600 12.5px/1 "Red Hat Text",system-ui,sans-serif;letter-spacing:0;cursor:pointer;transition:transform .15s}
.yks:active{transform:scale(.96)}
.yks b{font:900 22px/1 "Red Hat Display",system-ui,sans-serif;color:var(--accent);letter-spacing:-.02em}

/* compact bar that appears on scroll */
.topbar{position:fixed;top:0;left:0;right:0;z-index:18;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) max(18px,calc((100% - 680px)/2)) 8px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);box-shadow:0 1px 0 var(--hair);transform:translateY(-110%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.topbar.show{transform:none}
.topbar img{width:28px;height:28px;border-radius:8px;box-shadow:0 0 0 1px rgba(214,175,98,.5)}
.topbar b{font:800 16px/1 "Red Hat Display",system-ui,sans-serif;letter-spacing:-.01em}
.topbar span{margin-left:auto;font:700 13px/1 "Red Hat Text",system-ui,sans-serif;color:var(--accent)}

/* page heading */
.pagedesc{display:block;margin:0 0 18px;padding:0;border:0;border-radius:0;background:none}
.pagedesc b{display:block;font-weight:900;font-size:32px;line-height:1.05;letter-spacing:-.03em;text-transform:none;color:var(--ink)}
.pagedesc span{display:block;margin-top:8px;max-width:56ch;font-size:14px;line-height:1.45;color:var(--muted);opacity:1;min-width:0}
.ver{margin:26px 0 0;text-align:center;font-size:11px;color:var(--muted);opacity:.6}

/* surfaces: hierarchy by radius and fill, shadow only on floating things */
.panel{background:var(--surface);border:0;border-radius:26px;padding:20px;margin-bottom:14px;box-shadow:inset 0 0 0 1px var(--hair)}
.panel.plain{background:none;box-shadow:none;padding:0;border:0}
.stat,.week,.yksrow div,.grow,.tip,.erritem,.badge,.pmeta{background:var(--head);border:0;border-radius:16px}
.stats{gap:10px}
.stat{padding:14px 16px}
.stat b{font-weight:800;font-size:22px;line-height:1.15;letter-spacing:-.02em}
.stat span{display:block;margin-top:2px;font-size:12px;font-weight:500;color:var(--muted)}
.stat em{font-size:12px}
em.up{color:var(--ok)}em.down{color:var(--danger)}

/* controls */
.btn{border:0;background:var(--head);color:var(--ink);border-radius:14px;padding:10px 16px;font-weight:600;transition:transform .16s cubic-bezier(.2,.8,.2,1),background .2s,opacity .2s}
.btn:hover{border-color:transparent}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:none}
.btn.danger{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.btn.icon{width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:19px;line-height:1}
.btn:disabled{opacity:.35}
.inp{background:var(--head);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;margin-top:6px;color:var(--ink);font-weight:500;transition:border-color .18s,background .18s}
.inp:focus{border-color:var(--accent);background:var(--surface);outline:none}
.inp::placeholder{color:var(--muted);opacity:.75}
.grow .inp,.erritem .inp,.tip .inp{background:var(--surface)}
.pr,.dp,.chip{border:0;border-radius:999px;background:var(--head);color:var(--ink);font-size:13px;font-weight:600;padding:8px 14px;box-shadow:none;transition:background .22s,color .22s,transform .12s}
.pr:active,.dp:active,.chip:active{transform:scale(.95)}
.pr[aria-pressed="true"],.dp[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:none;border-color:transparent}
.pr.danger{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.dp{min-width:44px;padding:9px 0;text-align:center}
.hrow .dp{min-width:38px;padding:6px 0;font-size:12px;border-radius:999px}
.seg{display:inline-flex;gap:2px;padding:4px;background:var(--head);border-radius:999px}
.seg .pr{background:transparent;padding:8px 18px}
.seg .pr[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.exseg,.calseg{margin:0 0 14px}
.addbtn{width:100%;border:0;background:var(--head);border-radius:16px;padding:14px;font-weight:700;font-size:14px;color:var(--ink)}
.addbtn:hover{color:var(--ink)}
.panel.plain .addbtn,.addbar>.addbtn{background:var(--surface);box-shadow:inset 0 0 0 1px var(--hair)}
.sharebtn{border:0;background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);border-radius:999px;padding:10px 18px;font-weight:700;font-size:13px}
.padd .btn.primary{width:46px;height:auto;border-radius:14px;padding:0;font-size:22px}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

/* dock */
.dock{padding:0 12px calc(14px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;gap:2px;width:auto;max-width:none;padding:6px;border:0;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);box-shadow:inset 0 0 0 1px var(--hair),var(--float)}
.tabs .pill{display:none}
.tabs button{flex:none;flex-direction:row;justify-content:center;gap:0;height:46px;min-width:46px;padding:0 13px;border-radius:999px;font:700 13px/1 "Red Hat Text",system-ui,sans-serif;color:var(--muted);transition:background .3s,color .25s}
.tabs button .tl{max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .42s cubic-bezier(.2,.8,.2,1),margin .3s,opacity .25s}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button[aria-selected="true"] .tl{max-width:96px;margin-left:8px;opacity:1}
.tabs svg{width:21px;height:21px;transform:none!important}
@media (max-width:540px){.tabs{width:100%}.tabs button{flex:1;min-width:0;padding:0}.tabs button .tl{display:none}}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#0D1838;color:#F2EEE3;border-radius:999px;padding:12px 20px;font-weight:600;box-shadow:var(--float);max-width:calc(100% - 32px);text-align:center}
.toast.cheer{background:#0D1838;color:#F1DCA8;border:0;box-shadow:inset 0 0 0 1px rgba(216,179,106,.55),var(--float)}
.undo{bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#0D1838;color:#F2EEE3;border-radius:20px}
.undo button{background:#D8B36A;color:#0B1533;border-radius:999px}
.undo i{background:#D8B36A}

/* today */
.strip{gap:4px}
.sday{width:46px;border-radius:16px;font-size:11px;font-weight:600}
.sday.sel{background:var(--accent);color:var(--accent-ink)}
.sday.sel .mring{background:conic-gradient(var(--accent-ink) calc(var(--p)*1%),color-mix(in srgb,var(--accent-ink) 28%,transparent) 0)}
.sday.sel .mring::after{background:var(--accent)}
.sday.sel .mring b{color:var(--accent-ink)}
.hero{flex-direction:row;align-items:center;text-align:left;gap:24px;padding:16px 4px 4px}
.hero>div:last-child{flex:1;min-width:0}
.ring{width:136px;height:136px}
.ring circle{stroke-width:10}
.ring .fg{stroke-linecap:round}
.ringtxt b{font-weight:900;font-size:34px;letter-spacing:-.03em}
.ringtxt span{font-size:11px;font-weight:500}
.dtitle{font-weight:800;font-size:24px;letter-spacing:-.02em}
.dsub{font-size:14px;color:var(--muted)}
.quote{margin:12px 0 0;max-width:none;padding:0 0 0 12px;border:0;border-left:2px solid var(--gold);border-radius:0;background:none;font-style:normal;font-size:13.5px;line-height:1.5;color:var(--muted);opacity:1;text-align:left}
.hlist{gap:10px}
.hrowt{border:0;border-radius:22px;padding:14px 14px 14px 12px;gap:10px;box-shadow:inset 0 0 0 1px var(--hair);background:color-mix(in srgb,var(--hc,var(--surface)) 14%,var(--surface))}
.hrowt::before{left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0}
.hrowt[aria-pressed="true"]{background:color-mix(in srgb,var(--hc,var(--accent)) 26%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hc,var(--accent)) 45%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hrowt{background:color-mix(in srgb,var(--hc,var(--surface)) 9%,var(--surface))}:root:not([data-theme="light"]) .hrowt[aria-pressed="true"]{background:color-mix(in srgb,var(--hc,var(--accent)) 20%,var(--surface))}}
:root[data-theme="dark"] .hrowt{background:color-mix(in srgb,var(--hc,var(--surface)) 9%,var(--surface))}
.hn{font-weight:700;font-size:16px;letter-spacing:-.01em}
.hn small{font:400 12.5px/1.4 "Red Hat Text",system-ui,sans-serif;letter-spacing:0;color:var(--muted)}
.tick{width:42px;height:42px;border-radius:50%;border:2px solid var(--line)}
.hrowt[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.streak{min-width:58px;padding:7px 8px;border-radius:14px;font-weight:800;font-size:19px;background:color-mix(in srgb,var(--hc,var(--head)) 20%,var(--head))}
.streak small{color:var(--flame);font:600 10px/1.3 "Red Hat Text",system-ui,sans-serif}
.legend{justify-content:flex-start;font-size:11.5px;margin-top:16px}
.sublabel{font-size:13px;font-weight:700;color:var(--muted);margin:12px 4px 2px}
.energy button{height:42px;padding:0;border:0;border-radius:12px;background:var(--head);color:var(--muted);font:800 15px/1 "Red Hat Display",system-ui,sans-serif;filter:none;opacity:1;transform:none}
.energy button.on{background:var(--accent);color:var(--accent-ink)}
.energy button[aria-pressed="true"]{transform:none;border:0}
.stepper b{font-weight:800;font-size:20px}
.coach,.recov{border:0}
.phase{border-radius:999px;font:700 12px/1 "Red Hat Text",system-ui,sans-serif;padding:7px 12px}
.tip{padding:12px 14px}
.tip .btn{background:var(--surface);font-size:12.5px;padding:8px 12px}
.ring .bgc{stroke:var(--line)}
.rrow b{font-weight:800;font-size:17px}

/* program */
.pday{border:0;border-radius:24px;padding:16px 18px;box-shadow:inset 0 0 0 1px var(--hair)}
.pday.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.phead b{font-weight:800;font-size:17px;letter-spacing:-.01em}
.pmeta{font-weight:800;font-size:16px;padding:7px 11px}
.pchk{border-radius:50%}
.pmin,.psrc i{border-radius:999px}
.pbar i,.bar i{background:var(--accent)}

/* month & year */
.scroll{border:0;border-radius:18px;box-shadow:inset 0 0 0 1px var(--hair)}
.box{border-radius:7px}
.week .wt b{font-weight:700}
.td-today{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.ycell{border-radius:8px}

/* topics */
.tsub{border:0;border-radius:22px;padding:16px 18px;box-shadow:inset 0 0 0 1px var(--hair)}
.tname b{font-weight:800;font-size:17px;letter-spacing:-.01em}
.tpct{font-weight:900;font-size:20px;letter-spacing:-.02em}
.tchip{border-radius:999px;font-size:11.5px;font-weight:700;padding:5px 11px}
.tbar .b3,.tchip.s3,.tlegend .s3{background:var(--ok)}
.tchip.s2{color:var(--accent-ink)}
.tbar .b1,.tchip.s1,.tlegend .s1{background:var(--prog)}
.tchip.s1{color:#0B1533}
.tstatus{border-radius:14px}
.tstatus.ok{background:color-mix(in srgb,var(--ok) 15%,transparent)}

/* exams */
.yksc{position:relative;overflow:hidden;background:var(--surface)}
.yksbig{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.yksrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.yksrow b{display:block}
.yksrow span{display:block;margin-top:2px;color:var(--muted)}
.yksmeta{margin:14px 0 0;font-size:14px;color:var(--muted)}
.yksbig b{font-weight:900;font-size:64px;line-height:.95;letter-spacing:-.045em;color:var(--accent)}
.yksbig span{font-weight:700;font-size:16px;color:var(--muted)}
.yksrow b{font-weight:800;font-size:17px;letter-spacing:-.01em}
.yksrow span{font-size:12px;font-weight:500}
.yksrow div{padding:12px 14px}
.extable{border:0;border-radius:18px;box-shadow:inset 0 0 0 1px var(--hair)}
.exth{font-size:12px}
.exn{font-weight:800;font-size:16px}
.exnet{font-weight:900;font-size:26px;letter-spacing:-.03em}
.exhead b{font-weight:800}
.exavg{stroke:var(--muted);opacity:.7}
.extgt{stroke:var(--ok)}.extgl{fill:var(--ok)}
.exbub,.bub{border-radius:14px}
.wtag{border:0;border-radius:999px;padding:5px 4px 5px 12px}
.wtag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.wtag.r-bilgi::before{background:var(--accent)}.wtag.r-dikkat::before{background:var(--flame)}.wtag.r-sure::before{background:var(--danger)}.wtag.r-yorum::before{background:var(--ok)}
.rbar .r-yorum,.gbar i,.dbar.acc i{background:var(--ok)}
.duebadge{border-radius:999px;padding:3px 10px}
.erritem{border-left:0;padding:14px}
.erritem.due{box-shadow:inset 0 0 0 1.5px var(--danger)}

/* work */
.wbig{font-weight:800;font-size:26px}
.wday b{font-weight:800;font-size:18px}
.col{border-radius:8px 8px 3px 3px}
.wchart.dense .col{border-radius:4px 4px 2px 2px}
.fpanel.running{box-shadow:inset 0 0 0 1.5px var(--accent)}
.ftime b{font-weight:900;font-size:52px;letter-spacing:-.03em}
.ftime span{font-size:13px;font-weight:500}
.dbar{border-radius:999px;height:10px}.dbar i{border-radius:999px;background:var(--accent)}

/* lists, badges, sheet */
.badge{border-radius:18px;opacity:.5;filter:none;padding:14px 12px}
.badge.on{opacity:1;background:color-mix(in srgb,var(--gold) 14%,var(--head));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent)}
.badge i{display:block;height:30px}
.badge svg{width:28px;height:28px;fill:none;stroke:var(--muted);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge.on svg{stroke:var(--gold);fill:color-mix(in srgb,var(--gold) 22%,transparent)}
.sheet-card{border-radius:28px;box-shadow:var(--float)}
.sheet-card img{border-radius:20px}

/* motion: one entrance at launch, quick fades between pages */
#app.in{animation:none}
#app.in-l{animation:slideL .26s cubic-bezier(.2,.8,.2,1)}
#app.in-r{animation:slideR .26s cubic-bezier(.2,.8,.2,1)}
@keyframes slideL{from{opacity:0;transform:translateX(-12px)}}
@keyframes slideR{from{opacity:0;transform:translateX(12px)}}
#app.in-l .hrowt,#app.in-r .hrowt{animation:none}
#app.in>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#app.in>*:nth-child(2){animation-delay:.06s}#app.in>*:nth-child(3){animation-delay:.12s}#app.in>*:nth-child(4){animation-delay:.18s}#app.in>*:nth-child(n+5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

@media (max-width:620px){
  main{padding:18px 16px calc(124px + env(safe-area-inset-bottom,0px))}
  .logowrap{width:62px;height:62px;border-radius:18px}.brandrow{gap:13px}
  .brand{font-size:27px}
  .pagedesc b{font-size:28px}
  .panel{padding:16px;border-radius:22px}
  .hero{flex-direction:column;text-align:center;gap:14px}
  .quote{text-align:left}
  .yksbig b{font-size:52px}
  .ftime b{font-size:42px}
  .stat b{font-size:19px}
  .yks{padding:8px 12px;font-size:11.5px}.yks b{font-size:19px}
  .yksrow{grid-template-columns:1fr;gap:8px}.yksrow div{display:flex;align-items:baseline;gap:8px;padding:10px 14px}.yksrow span{margin:0}
  .padd{flex-wrap:wrap}.padd .inp:first-child{flex:1 1 100%}
  .psrcin{flex:1 1 0;width:auto;min-width:0}
  .wrow{flex-wrap:nowrap}.wrow select{flex:1 1 0}
}
@media (max-width:350px){.yks{grid-column:1/-1;grid-row:auto;justify-self:start;margin-top:10px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
(function(){

var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var RC=2*Math.PI*46;

function $(id){return document.getElementById(id)}
function pad(n){return n<10?'0'+n:''+n}
function mkey(y,m){return y+'-'+pad(m+1)}
function dkey(y,m,d){return mkey(y,m)+'-'+pad(d)}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function todayKey(){var t=new Date();return dkey(t.getFullYear(),t.getMonth(),t.getDate())}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pct(a,b){return b?Math.round(a/b*100):0}
function buzz(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
var tt;function toast(t,cheer){var el=$('toast');t=String(t).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/\s+([!.,])/g,'$1').trim();el.textContent=t;el.classList.toggle('cheer',!!cheer);el.classList.remove('show');void el.offsetWidth;el.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('show')},cheer?3200:2200)}
var BOOK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>';
var CHEERS=['Böyle devam et!','Harika gidiyorsun!','Bir gün daha, bir adım daha.','Disiplin kazanıyor.','Kendinle gurur duy.','İstikrar her şeydir.','Küçük adımlar, büyük sonuçlar.','Durma, çok iyi gidiyorsun!','Bu enerjiyi koru!'];
var MILES={3:'3 gün oldu, alışkanlık filizleniyor!',7:'Tam bir hafta! Muhteşem.',10:'10 gün! Çok sağlam gidiyorsun.',14:'İki hafta! İstikrarın göz dolduruyor.',21:'21 gün! Artık bu senin bir parçan.',30:'Bir ay! İnanılmaz bir istikrar.',50:'50 gün, durdurulamıyorsun!',75:'75 gün! Efsane yolunda.',100:'100 gün! Gerçek bir efsanesin.',200:'200 gün! Sınırları zorluyorsun.',365:'Tam bir yıl! Tebrikler, başardın.'};
var QUOTES=['Bugün attığın küçük adım, yarının büyük farkı.','Mükemmel olmak zorunda değilsin, sadece devam et.','İstikrar, motivasyonun bittiği yerde başlar.','Her tik, olmak istediğin kişiye bir adım.','Zor günler de yolculuğun bir parçası.','Yavaş ilerlemek, hiç ilerlememekten iyidir.','Kendine verdiğin sözü tut.','Bugünü kazan, yarın kendiliğinden gelir.','Bir gün daha. Sadece bir gün daha.','Bolluk, her gün tekrarlanan küçük işlerden doğar.'];
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function motivate(hid,y,m,d,wasRisk){
  if(dkey(y,m,d)>todayKey())return;
  var h=S.habits.filter(function(x){return x.id===hid})[0];if(!h)return;
  var s=streakAt(hid,new Date(y,m,d)),st=dayStats(y,m,d),isT=dkey(y,m,d)===todayKey(),msg;
  if(!isSch(h,y,m,d))msg=h.name+': planın dışında bonus gün, süpersin!';
  else if(isT&&st.n>1&&st.c===st.n)msg='Bugünkü hepsi tamam! Harika bir gün 🎉';
  else if(MILES[s.n])msg=h.name+': '+MILES[s.n];
  else if(wasRisk)msg='Seriyi kurtardın! Böyle devam et 💪';
  else if(s.n>=2)msg=h.name+' için '+s.n+' gün seri. '+pick(CHEERS);
  else msg='Güzel başlangıç! Yarın da devam.';
  toast(msg,true);
}

/* ---------- storage ---------- */
function loadLocal(){try{var r=localStorage.getItem(LK);if(r){var p=JSON.parse(r);if(p&&Array.isArray(p.habits)){S.habits=p.habits;S.months=p.months||{};S.work=p.work||{};S.plan=p.plan||{};S.exams=p.exams||[];S.topics=p.topics||S.topics;S.daily=p.daily||{};S.coach=p.coach||S.coach}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}}
function norm(){
  if(!Array.isArray(S.habits))S.habits=[];
  S.habits=S.habits.filter(function(h){return h&&h.id}).map(function(h){h.name=String(h.name||'Alışkanlık');h.goal=parseInt(h.goal,10)||20;return h});
  if(!S.daily||typeof S.daily!=='object'||Array.isArray(S.daily))S.daily={};
  if(!S.coach||typeof S.coach!=='object')S.coach={};var C=S.coach;if(!C.goals||typeof C.goals!=='object')C.goals={};if(!C.goals.TYT)C.goals.TYT={};if(!C.goals.AYT)C.goals.AYT={};
  if(!Array.isArray(C.errs))C.errs=[];C.errs=C.errs.filter(function(e){return e&&e.id});if(!Array.isArray(C.badges))C.badges=[];C.focusN=parseInt(C.focusN,10)||0;
  if(!S.topics||typeof S.topics!=='object')S.topics={};if(!S.topics.map||typeof S.topics.map!=='object')S.topics.map={};if(!S.topics.custom||typeof S.topics.custom!=='object')S.topics.custom={};if(['say','ea','soz','all'].indexOf(S.topics.alan)<0)S.topics.alan='say';
  Object.keys(S.topics.custom).forEach(function(k){var a=S.topics.custom[k];S.topics.custom[k]=Array.isArray(a)?a.filter(function(x){return typeof x==='string'&&x.trim()}).map(function(x){return x.slice(0,80)}):[]});
  Object.keys(S.topics.map).forEach(function(k){var r=S.topics.map[k];if(!r||typeof r!=='object'){S.topics.map[k]={s:0};return}r.s=Math.max(0,Math.min(3,parseInt(r.s,10)||0))});

var FKEY='habyt-focus',focus=null;

if(!focus)focus={mode:25,ders:'mat',run:false,start:0,acc:0};
function fSave(){try{localStorage.setItem(FKEY,JSON.stringify(focus))}catch(e){}}
function fElapsed(){return focus.acc+(focus.run?Date.now()-focus.start:0)}
function fFmt(ms){var s2=Math.max(0,Math.round(ms/1000)),m=Math.floor(s2/60),x=s2%60;return(m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function fDisplay(){var el=fElapsed();return focus.mode?fFmt(focus.mode*60000-el):fFmt(el)}
function focusPanel(){
  var el=fElapsed(),active=focus.run||el>0,p=focus.mode?Math.min(1,el/(focus.mode*60000)):0;
  return'<div class="panel fpanel'+(focus.run?' running':'')+'"><h3>Odak sayacı</h3>'+
    '<div class="presets">'+chips('fmode',[['25','25 dk'],['45','45 dk'],['60','60 dk'],['0','Serbest']],String(focus.mode))+'</div>'+

}
function fFinish(auto){var min=Math.floor(fElapsed()/60000);focus.run=false;focus.acc=0;focus.start=0;fSave();
  if(min>=1){addStudy(focus.ders,min);S.coach.focusN=(S.coach.focusN||0)+1;persist('coach');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}

  if(view==='work')render('keep')}
setInterval(function(){if(!focus.run)return;var el=fElapsed();if(focus.mode&&el>=focus.mode*60000){fFinish(true);return}
  var t=$('fTime');if(t)t.textContent=fDisplay();var r=$('fRing');if(r&&focus.mode)r.setAttribute('stroke-dashoffset',339.3*(1-Math.min(1,el/(focus.mode*60000))));else if(r)r.setAttribute('stroke-dashoffset',339.3*(1-(el%3600000)/3600000))},1000);
